name: Bug report
description: Something is broken - help us reproduce it.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The more precise, the faster it gets fixed.
  - type: input
    id: version
    attributes:
      label: Extension version
      description: From chrome://extensions, or the version in public/_locales/en/messages.json.
      placeholder: "0.3.11"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Browser and OS
      placeholder: "Chrome 140 / Brave 1.7x on Windows 11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact clicks and video types, in order.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Service worker or page console lines (no personal data).
      render: text
    validations:
      required: false
